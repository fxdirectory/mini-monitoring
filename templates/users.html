{% extends "layouts/base.html" %}

{% block title %}
Users
{% endblock %}

{% block content %}

<h2 class="title-page">Users & Groups</h2>

<div class="tabs">
    <button class="tab-button active" data-tab="users">Users</button>
    <button class="tab-button" data-tab="groups">Groups</button>
</div>

<div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search...">
    <div>
        <button id="btnAdd" onclick="openUserModal()">Add</button>
    </div>
</div>

<div id="usersTab" class="tab-content">
    <table class="table">
        <thead>
            <tr>
                <th>UID</th>
                <th>Username</th>
                <th>Home</th>
                <th>Groups</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>

</div>
<div id="groupsTab" class="tab-content" style="display:none;">
    <table class="table">
        <thead>
            <tr>
                <th>GID</th>
                <th>Group</th>
                <th>Members</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="groupsTable"></tbody>
    </table>
</div>

<!-- User Modal -->
<div id="userModal" class="modal">
    <div class="modal-content border-default">
        <div class="modal-header">
            <h3 id="modalTitle"></h3>
            <button class="modal-close border-default" onclick="closeUserModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="two-column">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password">
                    <small id="passwordHelp">Leave blank to keep current password.</small>
                </div>
            </div>

            <div class="two-column">
                <div class="input-group">
                    <label>Home Directory</label>
                    <input type="text" id="home">
                </div>
                <div class="input-group">
                    <label>Shell</label>
                    <select id="shell">
                        <option>/bin/bash</option>
                        <option>/bin/sh</option>
                        <option>/bin/zsh</option>
                    </select>
                </div>
            </div>

            <label>Primary Group</label>
            <select id="primaryGroup">
            </select>

            <label>Additional Groups</label>
            <div id="groupCheckboxes"></div>
            <div class="modal-footer">
                <button onclick="closeUserModal()">Cancel</button>
                <button id="saveUserBtn">Save</button>
            </div>
        </div>
    </div>
</div>
</div>

{% endblock %}

{% block scripts %}

<script src="/static/js/users.js"></script>

{% endblock %}
